AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS Document RAG — authenticated private document upload baseline.

Parameters:
  AllowedFrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact local origin permitted for browser requests in development.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Tracing: Disabled

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: aws-document-rag-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: aws-document-rag-spa
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs: [!Ref AllowedFrontendOrigin]
      LogoutURLs: [!Ref AllowedFrontendOrigin]
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub docrag-dev-${AWS::AccountId}
      ManagedLoginVersion: 1
      UserPoolId: !Ref UserPool

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedFrontendOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST]
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              audience: [!Ref UserPoolClient]
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
        DefaultAuthorizer: CognitoJwt

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: aws_document_rag.auth_handler.me
      Events:
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET

  DocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: aws_document_rag.document_handler.documents
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          DOCUMENTS_TABLE: !Ref DocumentsTable
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBase
          KNOWLEDGE_BASE_DATA_SOURCE_ID: !GetAtt KnowledgeBaseDataSource.DataSourceId
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DocumentsBucket
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${DocumentsBucket.Arn}/users/*
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:StartIngestionJob
                - bedrock:GetIngestionJob
              Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
      Events:
        Presign:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/presign
            Method: POST
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents
            Method: GET
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/{id}
            Method: GET
        Finalize:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/{id}/finalize
            Method: POST
        Ingest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/{id}/ingest
            Method: POST

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: aws_document_rag.query_handler.query
      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBase
          GENERATION_MODEL_ID: eu.amazon.nova-micro-v1:0
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable
        - Statement:
            - Sid: RetrieveOnlyFromProjectKnowledgeBase
              Effect: Allow
              Action: bedrock:Retrieve
              Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
            - Sid: InvokeApprovedNovaInferenceProfile
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/eu.amazon.nova-micro-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:eu-central-1::foundation-model/amazon.nova-micro-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:eu-north-1::foundation-model/amazon.nova-micro-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:eu-west-1::foundation-model/amazon.nova-micro-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:eu-west-3::foundation-model/amazon.nova-micro-v1:0
      Events:
        Query:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /query
            Method: POST

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: [content-type]
            AllowedMethods: [PUT]
            AllowedOrigins: [!Ref AllowedFrontendOrigin]
            MaxAge: 300
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: documentId
          AttributeType: S
      KeySchema:
        - AttributeName: ownerId
          KeyType: HASH
        - AttributeName: documentId
          KeyType: RANGE

  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VectorBucketName: !Sub docrag-vectors-${AWS::AccountId}
      EncryptionConfiguration:
        SseType: AES256

  VectorIndex:
    Type: AWS::S3Vectors::Index
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
      IndexName: document-rag-index
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine

  BedrockKnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
      Policies:
        - PolicyName: exact-knowledge-base-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeSelectedEmbeddingModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
              - Sid: ListPrivateDocumentPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentsBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: users/*
              - Sid: ReadPrivateDocumentsAndSidecars
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DocumentsBucket.Arn}/users/*
              - Sid: ExactVectorIndexAccess
                Effect: Allow
                Action:
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:QueryVectors
                  - s3vectors:GetIndex
                Resource: !GetAtt VectorIndex.IndexArn

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: aws-document-rag-dev
      Description: Owner-filtered private document retrieval knowledge base.
      RoleArn: !GetAtt BedrockKnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration:
              Dimensions: 1024
              EmbeddingDataType: FLOAT32
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          IndexArn: !GetAtt VectorIndex.IndexArn

  KnowledgeBaseDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: private_documents
      Description: Private owner-scoped documents and metadata sidecars.
      DataDeletionPolicy: RETAIN
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt DocumentsBucket.Arn
          InclusionPrefixes: [users/]
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 300
            OverlapPercentage: 20

Outputs:
  ApiUrl:
    Description: HTTP API base URL after an approved deployment.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Description: Cognito user pool identifier after an approved deployment.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Public SPA client identifier after an approved deployment.
    Value: !Ref UserPoolClient
  ManagedLoginUrl:
    Description: Cognito managed login base URL after an approved deployment.
    Value: !Sub https://docrag-dev-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
  KnowledgeBaseId:
    Description: Bedrock Knowledge Base identifier.
    Value: !Ref KnowledgeBase
  KnowledgeBaseDataSourceId:
    Description: Bedrock data source identifier.
    Value: !GetAtt KnowledgeBaseDataSource.DataSourceId

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS Document RAG — authenticated private document upload baseline.

Parameters:
  AllowedFrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact local origin permitted for browser requests in development.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Tracing: Disabled

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: aws-document-rag-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: aws-document-rag-spa
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs: [!Ref AllowedFrontendOrigin]
      LogoutURLs: [!Ref AllowedFrontendOrigin]
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub docrag-dev-${AWS::AccountId}
      ManagedLoginVersion: 1
      UserPoolId: !Ref UserPool

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedFrontendOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST]
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              audience: [!Ref UserPoolClient]
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
        DefaultAuthorizer: CognitoJwt

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: aws_document_rag.auth_handler.me
      Events:
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET

  DocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: aws_document_rag.document_handler.documents
      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          DOCUMENTS_TABLE: !Ref DocumentsTable
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DocumentsBucket
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${DocumentsBucket.Arn}/users/*
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
      Events:
        Presign:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/presign
            Method: POST
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents
            Method: GET
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/{id}
            Method: GET
        Finalize:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/{id}/finalize
            Method: POST

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: [content-type]
            AllowedMethods: [PUT]
            AllowedOrigins: [!Ref AllowedFrontendOrigin]
            MaxAge: 300
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: documentId
          AttributeType: S
      KeySchema:
        - AttributeName: ownerId
          KeyType: HASH
        - AttributeName: documentId
          KeyType: RANGE

Outputs:
  ApiUrl:
    Description: HTTP API base URL after an approved deployment.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Description: Cognito user pool identifier after an approved deployment.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Public SPA client identifier after an approved deployment.
    Value: !Ref UserPoolClient
  ManagedLoginUrl:
    Description: Cognito managed login base URL after an approved deployment.
    Value: !Sub https://docrag-dev-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com

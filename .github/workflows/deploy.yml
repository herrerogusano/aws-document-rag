name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: aws-document-rag-main
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aws-actions/setup-sam@v2
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: sam validate --lint
      - run: sam build
      - name: Frontend quality gates
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
      - name: Reject static AWS credential patterns
        run: |
          ! git grep -nE '(AKIA|ASIA)[A-Z0-9]{16}' -- . ':!docs/plan' ':!.github/workflows/ci.yml' ':!.github/workflows/deploy.yml'

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aws-actions/setup-sam@v2
      - name: Assume exact AWS deployment role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 1800
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          action-timeout-s: 180
      - name: Build and deploy the reviewed SAM template
        run: |
          sam build
          sam deploy \
            --stack-name "${{ vars.AWS_STACK_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --s3-bucket "${{ vars.AWS_SAM_ARTIFACT_BUCKET }}" \
            --capabilities CAPABILITY_IAM \
            --role-arn "${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}" \
            --parameter-overrides AllowedFrontendOrigin=http://localhost:5173 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
      - name: Read public deployment outputs
        id: stack
        run: |
          set -euo pipefail
          stack_output() {
            aws cloudformation describe-stacks \
              --stack-name "${{ vars.AWS_STACK_NAME }}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }
          api_url="$(stack_output ApiUrl)"
          client_id="$(stack_output UserPoolClientId)"
          cognito_domain="$(stack_output ManagedLoginUrl)"
          frontend_url="$(stack_output FrontendUrl)"
          frontend_bucket="$(stack_output FrontendBucketName)"
          distribution_id="$(stack_output FrontendDistributionId)"
          for value in "$api_url" "$client_id" "$cognito_domain" "$frontend_url" "$frontend_bucket" "$distribution_id"; do
            test -n "$value"
            test "$value" != "None"
          done
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
          echo "cognito_domain=$cognito_domain" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$frontend_url" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$frontend_bucket" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"
      - name: Build exact production frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.stack.outputs.api_url }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.stack.outputs.client_id }}
          VITE_COGNITO_DOMAIN: ${{ steps.stack.outputs.cognito_domain }}
          VITE_COGNITO_REDIRECT_URI: ${{ steps.stack.outputs.frontend_url }}/
        run: |
          npm ci
          npm run build
      - name: Publish without deleting prior artifacts
        working-directory: frontend
        run: |
          aws s3 cp dist/assets "s3://${{ steps.stack.outputs.frontend_bucket }}/assets" --recursive --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ steps.stack.outputs.frontend_bucket }}/index.html" --cache-control "no-cache,max-age=0" --content-type "text/html"
          aws cloudfront create-invalidation --distribution-id "${{ steps.stack.outputs.distribution_id }}" --paths "/*" > /dev/null
